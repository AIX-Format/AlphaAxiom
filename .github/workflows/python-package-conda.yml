name: Python Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime + test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pytest
          pip install pyyaml

      - name: Compile-check Python sources
        run: python -m compileall -q money-machine/src-python

      - name: Run pytest
        run: |
          cd money-machine/src-python
          python -m pytest tests/ -v
